[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentdomain-crewai"
version = "0.11.2"
description = "Read-only native CrewAI tools for the AgentDomain MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AgentDomain Contributors" }]
keywords = ["agentdomain", "crewai", "mcp", "base", "identity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["crewai==1.15.21", "mcp==1.28.1"]

[project.urls]
Homepage = "https://agentdomain.app"
Repository = "https://github.com/Talvono/AgentDomain"
Issues = "https://github.com/Talvono/AgentDomain/issues"

[project.scripts]
agentdomain-crewai = "agentdomain_crewai.connector:main"

[tool.hatch.build.targets.wheel]
only-include = [
  "src/agentdomain_crewai/__init__.py",
  "src/agentdomain_crewai/__main__.py",
  "src/agentdomain_crewai/connector.py",
  "src/agentdomain_crewai/py.typed",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
  ".gitignore",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
  "src/agentdomain_crewai/__init__.py",
  "src/agentdomain_crewai/__main__.py",
  "src/agentdomain_crewai/connector.py",
  "src/agentdomain_crewai/py.typed",
]

[tool.ruff]
target-version = "py312"
