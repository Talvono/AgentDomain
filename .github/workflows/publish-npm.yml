name: Publish npm packages

on:
  workflow_run:
    workflows: ['Public CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  plan:
    name: Plan a reviewed version change
    if: >-
      github.event_name == 'workflow_run' && github.event.action == 'completed' &&
      github.ref == 'refs/heads/main' && github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Public CI' &&
      github.event.workflow_run.path == '.github/workflows/public-ci.yml' &&
      github.event.workflow_run.id > 0 && github.event.workflow_run.run_attempt > 0 && github.event.workflow_run.workflow_id > 0 &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == 'Talvono/AgentDomain' && github.event.repository.id == '1310051881' &&
      github.event.repository.owner.login == 'Talvono' && github.event.repository.owner.id == '342912183' &&
      github.event.workflow_run.repository.full_name == 'Talvono/AgentDomain' && github.event.workflow_run.repository.id == '1310051881' &&
      github.event.workflow_run.repository.owner.login == 'Talvono' && github.event.workflow_run.repository.owner.id == '342912183' &&
      github.event.workflow_run.head_repository.full_name == 'Talvono/AgentDomain' && github.event.workflow_run.head_repository.id == '1310051881' &&
      github.event.workflow_run.head_repository.owner.login == 'Talvono' && github.event.workflow_run.head_repository.owner.id == '342912183' &&
      github.event.workflow_run.actor.login == '0xmdrakib' && github.event.workflow_run.actor.id == '113634586' && github.event.workflow_run.actor.type == 'User' &&
      github.event.workflow_run.triggering_actor.login == '0xmdrakib' && github.event.workflow_run.triggering_actor.id == '113634586' && github.event.workflow_run.triggering_actor.type == 'User' &&
      github.sha == github.event.workflow_run.head_sha &&
      github.repository == 'Talvono/AgentDomain' && github.repository_id == '1310051881' &&
      github.repository_owner_id == '342912183' &&
      github.actor == '0xmdrakib' && github.actor_id == '113634586' &&
      github.triggering_actor == '0xmdrakib'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release-needed: ${{ steps.plan.outputs.release-needed }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Skip unchanged versions before release builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/public-release-automation.mjs plan

  validate:
    name: Validate and package public releases
    needs: plan
    if: >-
      needs.plan.outputs.release-needed == 'true' &&
      github.event_name == 'workflow_run' && github.event.action == 'completed' &&
      github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Public CI' && github.event.workflow_run.path == '.github/workflows/public-ci.yml' &&
      github.event.workflow_run.id > 0 && github.event.workflow_run.run_attempt > 0 && github.event.workflow_run.workflow_id > 0 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == 'Talvono/AgentDomain' && github.event.repository.id == '1310051881' &&
      github.event.repository.owner.login == 'Talvono' && github.event.repository.owner.id == '342912183' &&
      github.event.workflow_run.repository.full_name == 'Talvono/AgentDomain' && github.event.workflow_run.repository.id == '1310051881' &&
      github.event.workflow_run.repository.owner.login == 'Talvono' && github.event.workflow_run.repository.owner.id == '342912183' &&
      github.event.workflow_run.head_repository.full_name == 'Talvono/AgentDomain' && github.event.workflow_run.head_repository.id == '1310051881' &&
      github.event.workflow_run.head_repository.owner.login == 'Talvono' && github.event.workflow_run.head_repository.owner.id == '342912183' &&
      github.event.workflow_run.actor.login == '0xmdrakib' && github.event.workflow_run.actor.id == '113634586' && github.event.workflow_run.actor.type == 'User' &&
      github.event.workflow_run.triggering_actor.login == '0xmdrakib' && github.event.workflow_run.triggering_actor.id == '113634586' && github.event.workflow_run.triggering_actor.type == 'User' &&
      github.event.workflow_run.event == 'push' && github.sha == github.event.workflow_run.head_sha &&
      github.ref == 'refs/heads/main' && github.repository_id == '1310051881' &&
      github.actor == '0xmdrakib' && github.actor_id == '113634586' &&
      github.triggering_actor == '0xmdrakib' &&
      github.repository == 'Talvono/AgentDomain' && github.repository_owner_id == '342912183'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      release-manifest-sha256: ${{ steps.pack-release.outputs.release-manifest-sha256 }}
      publication-authorized: ${{ steps.source-qualification.outputs.publication-authorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify public boundary before dependency installation
        run: node scripts/check-public-boundary.mjs

      - name: Require successful Public CI for this exact main commit
        id: source-qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-release-ci.mjs --github

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Reject high-severity production dependency findings
        run: pnpm audit:production:high

      - run: pnpm --filter @agentdomain/shared build
      - run: pnpm --filter @agentdomain/sdk build
      - run: pnpm --filter @agentdomain/mcp-server build
      - run: pnpm --filter @agentdomain/agentkit-plugin build
      - run: pnpm --filter @agentdomain/eliza-plugin build
      - run: pnpm --filter @agentdomain/langchain-plugin build

      - name: Pack reviewed packages and the OIDC-capable npm CLI
        id: pack-release
        shell: bash
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/agentdomain-release"
          package_dir="$release_dir/packages"
          tooling_dir="$release_dir/tooling"
          publish_order="$release_dir/publish-order.tsv"
          checksums="$release_dir/release.sha256"
          mkdir -p "$package_dir" "$tooling_dir"
          : > "$publish_order"
          : > "$checksums"

          pack_release() {
            local source_dir="$1"
            local name
            local version
            local slug
            local archive

            name="$(node -p "require('./${source_dir}/package.json').name")"
            version="$(node -p "require('./${source_dir}/package.json').version")"
            pnpm --dir "$source_dir" pack --pack-destination "$package_dir"
            slug="${name#@}"
            slug="${slug//\//-}"
            archive="$package_dir/${slug}-${version}.tgz"
            test -f "$archive"
            printf '%s\t%s\tpackages/%s\n' "$name" "$version" "$(basename "$archive")" >> "$publish_order"
            printf '%s  packages/%s\n' "$(sha256sum "$archive" | cut -d ' ' -f 1)" "$(basename "$archive")" >> "$checksums"
          }

          pack_release packages/shared
          pack_release packages/sdk
          pack_release packages/mcp-server
          pack_release packages/agentkit-plugin
          pack_release packages/eliza-plugin
          pack_release packages/langchain-plugin

          npm pack 'npm@11.5.1' --ignore-scripts --pack-destination "$tooling_dir" >/dev/null
          npm_archive="$tooling_dir/npm-11.5.1.tgz"
          test -f "$npm_archive"
          printf '%s  tooling/%s\n' "$(sha256sum "$npm_archive" | cut -d ' ' -f 1)" "$(basename "$npm_archive")" >> "$checksums"
          printf '%s  publish-order.tsv\n' "$(sha256sum "$publish_order" | cut -d ' ' -f 1)" >> "$checksums"
          for script in npm-release.mjs release-artifacts.py public-release-identity.mjs public-release-policy.json verify-release-ci.mjs; do
            cp "scripts/$script" "$tooling_dir/$script"
            printf '%s  tooling/%s\n' "$(sha256sum "$tooling_dir/$script" | cut -d ' ' -f 1)" "$script" >> "$checksums"
          done

          test "$(wc -l < "$publish_order")" -eq 6
          test "$(wc -l < "$checksums")" -eq 13
          python scripts/release-artifacts.py verify-npm --output "$release_dir"
          (cd "$release_dir" && sha256sum --check --strict release.sha256)
          manifest_sha256="$(sha256sum "$checksums" | cut -d ' ' -f 1)"
          test "${#manifest_sha256}" -eq 64
          printf 'release-manifest-sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release inputs
        id: upload-release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-packages-${{ github.sha }}
          path: ${{ runner.temp }}/agentdomain-release
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish npm ${{ needs.plan.outputs.version }} (Public CI ${{ github.event.workflow_run.id }}/${{ github.event.workflow_run.run_attempt }})
    needs: [plan, validate]
    if: >-
      needs.validate.outputs.publication-authorized == 'true' &&
      github.event_name == 'workflow_run' && github.event.action == 'completed' &&
      github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Public CI' && github.event.workflow_run.path == '.github/workflows/public-ci.yml' &&
      github.event.workflow_run.id > 0 && github.event.workflow_run.run_attempt > 0 && github.event.workflow_run.workflow_id > 0 &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == 'Talvono/AgentDomain' && github.event.repository.id == '1310051881' &&
      github.event.repository.owner.login == 'Talvono' && github.event.repository.owner.id == '342912183' &&
      github.event.workflow_run.repository.full_name == 'Talvono/AgentDomain' && github.event.workflow_run.repository.id == '1310051881' &&
      github.event.workflow_run.repository.owner.login == 'Talvono' && github.event.workflow_run.repository.owner.id == '342912183' &&
      github.event.workflow_run.head_repository.full_name == 'Talvono/AgentDomain' && github.event.workflow_run.head_repository.id == '1310051881' &&
      github.event.workflow_run.head_repository.owner.login == 'Talvono' && github.event.workflow_run.head_repository.owner.id == '342912183' &&
      github.event.workflow_run.actor.login == '0xmdrakib' && github.event.workflow_run.actor.id == '113634586' && github.event.workflow_run.actor.type == 'User' &&
      github.event.workflow_run.triggering_actor.login == '0xmdrakib' && github.event.workflow_run.triggering_actor.id == '113634586' && github.event.workflow_run.triggering_actor.type == 'User' &&
      github.event.workflow_run.event == 'push' && github.sha == github.event.workflow_run.head_sha &&
      github.ref == 'refs/heads/main' && github.repository_id == '1310051881' &&
      github.actor == '0xmdrakib' && github.actor_id == '113634586' &&
      github.triggering_actor == '0xmdrakib' &&
      github.repository == 'Talvono/AgentDomain' && github.repository_owner_id == '342912183'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download validated release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-packages-${{ github.sha }}
          path: ${{ runner.temp }}/agentdomain-release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify staged release inputs
        shell: bash
        env:
          EXPECTED_RELEASE_MANIFEST_SHA256: ${{ needs.validate.outputs.release-manifest-sha256 }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/agentdomain-release"
          test -f "$release_dir/publish-order.tsv"
          test -f "$release_dir/release.sha256"
          test "$(wc -l < "$release_dir/publish-order.tsv")" -eq 6
          test "$(wc -l < "$release_dir/release.sha256")" -eq 13
          [[ "$EXPECTED_RELEASE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_RELEASE_MANIFEST_SHA256" "$release_dir/release.sha256" | sha256sum --check --status
          (cd "$release_dir" && sha256sum --check --strict release.sha256)
          python "$release_dir/tooling/release-artifacts.py" verify-npm --output "$release_dir"

          mkdir -p "$RUNNER_TEMP/npm-cli"
          tar -xzf "$release_dir/tooling/npm-11.5.1.tgz" -C "$RUNNER_TEMP/npm-cli"
          test "$(node "$RUNNER_TEMP/npm-cli/package/bin/npm-cli.js" --version)" = '11.5.1'

      - name: Requalify the exact source immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/agentdomain-release/tooling/verify-release-ci.mjs" --github

      - name: Publish all six established packages using OIDC only
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/agentdomain-release"
          npm_cli="$RUNNER_TEMP/npm-cli/package/bin/npm-cli.js"
          node "$release_dir/tooling/npm-release.mjs" "$release_dir" "$npm_cli" oidc
