name: Complete public release

on:
  workflow_run:
    workflows: [Publish npm packages, Publish Python packages]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: complete-public-release
  cancel-in-progress: false

jobs:
  complete:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.ref == 'refs/heads/main' && github.repository == 'Talvono/AgentDomain' &&
      github.repository_id == '1310051881' && github.repository_owner_id == '342912183' &&
      github.actor == '0xmdrakib' && github.actor_id == '113634586' &&
      github.triggering_actor == '0xmdrakib' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.login == '0xmdrakib' &&
      github.event.workflow_run.actor.id == 113634586 &&
      github.event.workflow_run.triggering_actor.login == '0xmdrakib' &&
      github.event.workflow_run.triggering_actor.id == 113634586 &&
      github.event.workflow_run.repository.id == 1310051881 &&
      github.event.workflow_run.head_repository.id == 1310051881 &&
      (github.event.workflow_run.path == '.github/workflows/publish-npm.yml' ||
      github.event.workflow_run.path == '.github/workflows/publish-python.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Skip unchanged versions before verifier installation
        id: completion-plan
        run: node scripts/public-release-automation.mjs completion-plan
      - name: Install isolated hash-pinned official provenance verifiers
        if: steps.completion-plan.outputs.release-needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-verification"
          "$RUNNER_TEMP/release-verification/bin/python" -m pip install --disable-pip-version-check --retries 0 --timeout 10 --require-hashes -r scripts/python-release-verification-requirements.lock
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 --max-filesize 16777216 --retry 0 https://registry.npmjs.org/npm/-/npm-11.5.1.tgz --output "$RUNNER_TEMP/release-npm.tgz"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {createHash} from "node:crypto"; const hash=createHash("sha512").update(readFileSync(process.env.RUNNER_TEMP+"/release-npm.tgz")).digest("base64"); if(hash!=="Iy5vXZ55m8tIaSCz6bqQf9+W5XbPfoyURsgWLjOkFglqHTep6RDZqRj2sfYGeRyZvGu2HuJWm0lux0rxPQ29lQ==") process.exit(1);'
          mkdir "$RUNNER_TEMP/release-npm"
          tar -xzf "$RUNNER_TEMP/release-npm.tgz" -C "$RUNNER_TEMP/release-npm"
      - name: Verify both publications and finalize immutable release
        id: complete
        if: steps.completion-plan.outputs.release-needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_NPM_CLI: ${{ runner.temp }}/release-npm/package/bin/npm-cli.js
          PUBLIC_RELEASE_VERIFY_PYTHON: ${{ runner.temp }}/release-verification/bin/python
        run: node scripts/public-release-automation.mjs complete
      - name: Remove task-owned temporary verification inputs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/release-npm" "$RUNNER_TEMP/release-verification"
          rm -f -- "$RUNNER_TEMP/release-npm.tgz"
