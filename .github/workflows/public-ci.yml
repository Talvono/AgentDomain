name: Public CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Boundary, packages, frontend, docs, and Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 0 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Reject secrets from the complete Git history
        shell: bash
        run: |
          set -euo pipefail
          if ! gitleaks git "$GITHUB_WORKSPACE" \
            --log-opts='--all --full-history HEAD' \
            --redact=100 \
            --no-banner \
            --no-color \
            --timeout=120 \
            >/dev/null 2>&1; then
            echo '::error::The redacted full-history secret scan failed. Reproduce only in an approved local environment; CI suppresses finding details.'
            exit 1
          fi
          echo 'Redacted full-history secret scan passed.'

      - name: Set up Python for boundary checks and native integration
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify public boundary before dependency installation
        run: node scripts/check-public-boundary.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify affected public source with mandatory full fallback
        id: public-scope
        run: pnpm ci:public --affected --cloudflare

      - name: Test release and routing guards
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/npm-release.test.mjs
          node --test scripts/public-release-automation.test.mjs
          node --test scripts/public-ci-postbuild.test.mjs
          python -B -m unittest discover -s scripts -p test_release_artifacts.py
          python -B -m unittest discover -s scripts -p test_python_boundary.py

      - name: Qualify isolated web and native Python post-build lanes
        id: public-postbuild
        env:
          PUBLIC_CI_POSTBUILD_SCOPE: ${{ steps.public-scope.outputs.scope }}
        run: node scripts/public-ci-postbuild.mjs

      - name: Full Public Qualification (agentdomain.public-ci.full.v1)
        if: steps.public-scope.outputs.scope == 'full' && steps.public-postbuild.outputs.complete == 'true'
        run: echo "Full public qualification passed for $GITHUB_SHA."
